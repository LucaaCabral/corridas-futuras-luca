[project]
name = "coletor"
version = "0.1.0"
description = "Coleta corridas de rua dos principais sites brasileiros e exporta JSON para o front-end"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coletor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
